version: '3.8'

services:
  portfolio:
    container_name: portfolio
    # Use a pre-built image from a Docker registry instead of building locally
    image: awaghray/portfolio:latest
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
    # Serves the built Astro site (matches the Dockerfile CMD / package.json start)
    command: npm start
    restart: always
